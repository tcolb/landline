# Build the unsigned iOS ipas and publish them through the fixed-tag
# `sidestore` release, whose asset URLs are the stable install channel
# (users re-sign with their own Apple ID at install time — no dev account).
#
# Jobs:
#   release — the shippable app; simulator-smoke-tested against a mock
#             daemon (attaches and renders a terminal) before publishing.
#   dev     — expo-dev-client variant (.dev bundle id) that loads JS from a
#             Metro server for fast local iteration.
#   publish — regenerates source.json from both ipas and updates the
#             fixed-tag release.
name: ios-ipa

on:
  workflow_dispatch:
  push:
    tags: ["mobile-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Fixed path so the compiler cache is restorable across runs; the RN
      # wrapper patch below exports the same dir.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      # The Expo JSI package needs Swift tools >= 6.2, but the newest
      # Swift on the image breaks its source; pin to a 6.2 toolchain.
      - name: Select Xcode with Swift 6.2
        run: |
          PICK=""
          for x in /Applications/Xcode_*.app; do
            v=$("$x"/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift --version 2>/dev/null | head -1)
            case "$v" in *"Swift version 6.2"*) PICK="$x";; esac
          done
          [ -z "$PICK" ] && PICK=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "using $PICK"
          sudo xcode-select -s "$PICK"

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml

      # --- Cache restore (all refs; only main writes below, so branches get
      # a warm read-only start without thrashing the shared cache budget) ---
      - name: Restore CocoaPods
        id: restore-pods
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-ios-${{ hashFiles('apps/mobile/pnpm-lock.yaml') }}
          restore-keys: pods-ios-

      # Compiler cache — the actual native-compile speedup. One entry for
      # this job's device+simulator compiles ("release" flavor); the dev job
      # keeps its own ("dev": Debug objects differ wholesale).
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ios-release-${{ hashFiles('apps/mobile/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ccache-ios-release-${{ hashFiles('apps/mobile/pnpm-lock.yaml') }}-
            ccache-ios-release-

      # Before pod install so RN's Podfile (apple.ccacheEnabled via
      # expo-build-properties) wires CC to its ccache wrappers.
      - name: Install ccache
        run: |
          command -v ccache >/dev/null || brew install ccache
          ccache -z

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Xcode 26 leaves $CCACHE_BINARY empty in RN's wrapper scripts; pin the
      # real binary and cache dir into them.
      - name: Route ccache (patch RN wrapper)
        run: |
          set -euo pipefail
          CCACHE_BIN="$(command -v ccache)"
          count=0
          patch() {
            local w="$1"
            [ -f "$w" ] || return 0
            grep -q 'LANDLINE_CCACHE_FIX' "$w" && return 0
            local tmp; tmp="$(mktemp)"
            awk -v bin="$CCACHE_BIN" -v dir="$CCACHE_DIR" '
              /^exec / && !ins {
                print "export CCACHE_DIR=\"" dir "\"  # LANDLINE_CCACHE_FIX"
                print "export CCACHE_MAXSIZE=3G"
                sub(/\$CCACHE_BINARY/, bin)
                ins=1
              }
              { print }
            ' "$w" > "$tmp"
            chmod +x "$tmp"; mv "$tmp" "$w"
            echo "patched $w"; count=$((count + 1))
          }
          RN="$(node -e "console.log(require('path').dirname(require.resolve('react-native/package.json')))")"
          patch "$RN/scripts/xcode/ccache-clang.sh"
          patch "$RN/scripts/xcode/ccache-clang++.sh"
          [ "$count" -gt 0 ] || { echo "ERROR: no RN ccache wrapper found"; exit 1; }

      - name: Generate the native iOS project
        run: pnpm exec expo prebuild --platform ios --no-install

      - name: Install pods
        run: pod install --project-directory=ios

      - name: Build (unsigned)
        run: |
          set +e
          xcodebuild \
            -workspace ios/landline.xcworkspace \
            -scheme landline \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "===== error lines ====="
            grep -nE "(^|\s)error:|fatal error|Command PhaseScriptExecution failed" xcodebuild.log | head -60
            echo "===== tail ====="
            tail -120 xcodebuild.log
          else
            tail -20 xcodebuild.log
          fi
          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: apps/mobile/xcodebuild.log
          if-no-files-found: ignore

      - name: Package .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/landline.app
          test -d "$APP"
          rm -rf Payload out && mkdir -p Payload out
          cp -R "$APP" Payload/
          zip -qry out/landline.ipa Payload

      # Persist caches BEFORE the smoke gate: a failed smoke must not throw
      # away the compile work (the sim compile below adds little — the smoke
      # rebuild next run restores instantly either way).
      - name: Save CocoaPods
        if: github.ref == 'refs/heads/main' && steps.restore-pods.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-ios-${{ hashFiles('apps/mobile/pnpm-lock.yaml') }}

      # Boot the app on a simulator and drive a real terminal against a
      # mock daemon: a build that black-screens or dies on attach must
      # never reach the install channel. Screenshot + JS console land in
      # artifacts for remote eyes.
      - name: Simulator smoke test
        run: |
          export EXPO_PUBLIC_AUTOTEST=1
          # Constants-manifest path: read by app.config.js during the
          # EXConstants build phase, immune to Metro transform caching.
          export LANDLINE_AUTOTEST=1
          # The device bundle above warmed Metro's transform cache WITHOUT
          # these vars; stale entries would silently drop the inline.
          rm -rf "$TMPDIR"/metro-* "$TMPDIR"/haste-* node_modules/.cache 2>/dev/null || true
          xcodebuild \
            -workspace ios/landline.xcworkspace \
            -scheme landline \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath simbuild \
            CODE_SIGNING_ALLOWED=NO \
            build > simbuild.log 2>&1 || { tail -80 simbuild.log; exit 1; }
          python3 ../../scripts/e2e/mock-daemon.py > mock-daemon.log 2>&1 &
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime in sorted(devices, reverse=True):
              for dev in devices[runtime]:
                  if 'iPhone' in dev['name']:
                      print(dev['udid']); raise SystemExit
          ")
          echo "simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" simbuild/Build/Products/Release-iphonesimulator/landline.app
          xcrun simctl launch --console-pty "$UDID" com.tcolb.landline > sim-console.log 2>&1 &
          sleep 25
          xcrun simctl io "$UDID" screenshot sim-screen.png
          echo "--- app console ---"
          cat sim-console.log
          echo "--- mock daemon ---"
          cat mock-daemon.log
          if ! xcrun simctl spawn "$UDID" launchctl list | grep -q com.tcolb.landline; then
            echo "APP PROCESS DIED"
            exit 1
          fi
          # The screenshot alone can pass on the wrong screen; require the
          # app to have actually attached to the mock session.
          if ! grep -q "ATTACHED" mock-daemon.log; then
            echo "APP NEVER ATTACHED TO THE MOCK DAEMON"
            exit 1
          fi

      - name: Upload simulator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-smoke
          path: |
            apps/mobile/sim-screen.png
            apps/mobile/sim-console.log
            apps/mobile/mock-daemon.log
          if-no-files-found: ignore

      - name: Report ccache stats
        if: always()
        run: ccache -s -v 2>/dev/null || ccache -s

      # Only main persists caches: one authoritative warm entry instead of a
      # per-branch pile LRU-evicting it. always(): a smoke failure must not
      # discard the compile work (device + sim objects both live here).
      - name: Save ccache
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ios-release-${{ hashFiles('apps/mobile/pnpm-lock.yaml') }}-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: landline-ipa
          path: apps/mobile/out/landline.ipa

  dev:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode with Swift 6.2
        run: |
          PICK=""
          for x in /Applications/Xcode_*.app; do
            v=$("$x"/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift --version 2>/dev/null | head -1)
            case "$v" in *"Swift version 6.2"*) PICK="$x";; esac
          done
          [ -z "$PICK" ] && PICK=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$PICK"

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml

      - name: Restore CocoaPods
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-ios-${{ hashFiles('apps/mobile/pnpm-lock.yaml') }}
          restore-keys: pods-ios-

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ios-dev-${{ hashFiles('apps/mobile/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ccache-ios-dev-${{ hashFiles('apps/mobile/pnpm-lock.yaml') }}-
            ccache-ios-dev-

      - name: Install ccache
        run: |
          command -v ccache >/dev/null || brew install ccache
          ccache -z

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Route ccache (patch RN wrapper)
        run: |
          set -euo pipefail
          CCACHE_BIN="$(command -v ccache)"
          count=0
          patch() {
            local w="$1"
            [ -f "$w" ] || return 0
            grep -q 'LANDLINE_CCACHE_FIX' "$w" && return 0
            local tmp; tmp="$(mktemp)"
            awk -v bin="$CCACHE_BIN" -v dir="$CCACHE_DIR" '
              /^exec / && !ins {
                print "export CCACHE_DIR=\"" dir "\"  # LANDLINE_CCACHE_FIX"
                print "export CCACHE_MAXSIZE=3G"
                sub(/\$CCACHE_BINARY/, bin)
                ins=1
              }
              { print }
            ' "$w" > "$tmp"
            chmod +x "$tmp"; mv "$tmp" "$w"
            echo "patched $w"; count=$((count + 1))
          }
          RN="$(node -e "console.log(require('path').dirname(require.resolve('react-native/package.json')))")"
          patch "$RN/scripts/xcode/ccache-clang.sh"
          patch "$RN/scripts/xcode/ccache-clang++.sh"
          [ "$count" -gt 0 ] || { echo "ERROR: no RN ccache wrapper found"; exit 1; }

      - name: Generate the native iOS project (dev variant)
        run: APP_VARIANT=dev pnpm exec expo prebuild --platform ios --no-install

      - name: Install pods
        run: pod install --project-directory=ios

      # Debug configuration: dev-client launcher included, JS loaded from a
      # Metro dev server at runtime instead of a bundled jsbundle.
      - name: Build dev client (unsigned, Debug)
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace: $WORKSPACE scheme: $SCHEME"
          set +e
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > xcodebuild-dev.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -nE "(^|\s)error:|fatal error" xcodebuild-dev.log | head -40
            tail -80 xcodebuild-dev.log
          fi
          exit $status

      - name: Upload dev build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-dev-log
          path: apps/mobile/xcodebuild-dev.log
          if-no-files-found: ignore

      - name: Package dev .ipa
        run: |
          APP=$(ls -d build/Build/Products/Debug-iphoneos/*.app | head -1)
          test -d "$APP"
          rm -rf Payload out && mkdir -p Payload out
          cp -R "$APP" Payload/
          zip -qry out/landline-dev.ipa Payload

      - name: Report ccache stats
        if: always()
        run: ccache -s -v 2>/dev/null || ccache -s

      - name: Save ccache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ios-dev-${{ hashFiles('apps/mobile/pnpm-lock.yaml') }}-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: landline-dev-ipa
          path: apps/mobile/out/landline-dev.ipa

  publish:
    runs-on: ubuntu-latest
    needs: [release, dev]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: landline-ipa
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: landline-dev-ipa
          path: out

      - name: Generate SideStore source
        run: |
          python3 scripts/make-sidestore-source.py out/source.json \
            out/landline.ipa \
            "https://github.com/${{ github.repository }}/releases/download/sidestore/landline.ipa" \
            out/landline-dev.ipa \
            "https://github.com/${{ github.repository }}/releases/download/sidestore/landline-dev.ipa"
          cat out/source.json

      - name: Publish to the sidestore release channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view sidestore --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create sidestore \
              --repo "${{ github.repository }}" \
              --title "SideStore channel" \
              --notes "Install in SideStore: sidestore://source?url=https://github.com/${{ github.repository }}/releases/download/sidestore/source.json — or add the source URL manually: https://github.com/${{ github.repository }}/releases/download/sidestore/source.json"
          gh release upload sidestore out/landline.ipa out/landline-dev.ipa out/source.json \
            --repo "${{ github.repository }}" --clobber
