# Build the unsigned iOS .ipa and publish it through the fixed-tag
# `sidestore` release, whose asset URLs are the stable install channel
# (users re-sign with their own Apple ID at install time — no dev account).
name: ios-ipa

on:
  workflow_dispatch:
  push:
    tags: ["mobile-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      # The Expo JSI package needs Swift tools >= 6.2, but the newest
      # Swift on the image breaks its source; pin to a 6.2 toolchain.
      - name: Select Xcode with Swift 6.2
        run: |
          PICK=""
          for x in /Applications/Xcode_*.app; do
            v=$("$x"/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift --version 2>/dev/null | head -1)
            echo "$x -> $v"
            case "$v" in *"Swift version 6.2"*) PICK="$x";; esac
          done
          if [ -z "$PICK" ]; then
            echo "no Swift 6.2 toolchain found; falling back to newest"
            PICK=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          fi
          echo "using $PICK"
          sudo xcode-select -s "$PICK"
          xcodebuild -version

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the native iOS project
        run: pnpm exec expo prebuild --platform ios --no-install

      - name: Install pods
        run: pod install --project-directory=ios

      - name: Build (unsigned)
        run: |
          set +e
          xcodebuild \
            -workspace ios/landline.xcworkspace \
            -scheme landline \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "===== error lines ====="
            grep -nE "(^|\s)error:|fatal error|Command PhaseScriptExecution failed" xcodebuild.log | head -60
            echo "===== failing script phase context ====="
            grep -n "PhaseScriptExecution" xcodebuild.log | tail -5
            awk '/PhaseScriptExecution/{p=NR} END{print p}' xcodebuild.log | while read -r n; do
              [ -n "$n" ] && sed -n "${n},$((n+120))p" xcodebuild.log
            done
            echo "===== tail ====="
            tail -120 xcodebuild.log
          else
            tail -20 xcodebuild.log
          fi
          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: apps/mobile/xcodebuild.log
          if-no-files-found: ignore

      - name: Package .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/landline.app
          test -d "$APP"
          rm -rf Payload out && mkdir -p Payload out
          cp -R "$APP" Payload/
          zip -qry out/landline.ipa Payload

      - name: Generate SideStore source
        run: |
          python3 ../../scripts/make-sidestore-source.py \
            out/landline.ipa \
            "https://github.com/${{ github.repository }}/releases/download/sidestore/landline.ipa" \
            out/source.json
          cat out/source.json

      - name: Publish to the sidestore release channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view sidestore --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create sidestore \
              --repo "${{ github.repository }}" \
              --title "SideStore channel" \
              --notes "Install in SideStore: sidestore://source?url=https://github.com/${{ github.repository }}/releases/download/sidestore/source.json — or add the source URL manually: https://github.com/${{ github.repository }}/releases/download/sidestore/source.json"
          gh release upload sidestore out/landline.ipa out/source.json \
            --repo "${{ github.repository }}" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: landline-ipa
          path: apps/mobile/out/landline.ipa
