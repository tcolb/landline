# mise is this project's tool + package manager.
# https://mise.jdx.dev
#
# Pin every language runtime and CLI dependency here so `mise install` is the
# only bootstrap step. Do not rely on system-installed toolchains.

[tools]
rust = "stable"      # landlined runtime, CLI, relay (crates/)
node = "22"          # Expo / React Native mobile app (apps/mobile)
pnpm = "latest"
zig = "0.15"        # build dep of libghostty-vt (ghostty needs >= 0.15.2); also our cc
python = "3.12"     # e2e test scripts

[tasks]
build = "cargo build"
test = "cargo test"
lint = "cargo clippy --all-targets -- -D warnings"
fmt = "cargo fmt"
e2e = "bash scripts/e2e.sh"

[tasks.mobile]
description = "Start the Expo dev server (scan QR with Expo Go on the same LAN)"
dir = "apps/mobile"
run = "pnpm start"

[tasks.mobile-install]
description = "Install mobile app dependencies"
dir = "apps/mobile"
run = "pnpm install"

[tasks.mobile-check]
description = "Typecheck the mobile app"
dir = "apps/mobile"
run = "pnpm run check"

[settings]
# Fail loudly instead of silently falling back to a system tool.
not_found_auto_install = false
